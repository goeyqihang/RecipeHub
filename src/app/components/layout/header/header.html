<header>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0d6efd;">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/dashboard">
        <img src="logo.png" alt="Recipe Hub Logo" class="navbar-logo">
        <strong>Recipe Hub</strong>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      @if (currentUser$ | async; as user) {
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
              [routerLinkActiveOptions]="{exact: true}">Home</a>
          </li>

          @if (user.role === 'chef') {
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Recipes
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" routerLink="/recipes">View All Recipes</a></li>
              <li><a class="dropdown-item" routerLink="/recipes/add">Add New Recipe</a></li>
            </ul>
          </li>
          }

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Inventory
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" routerLink="/inventory">Dashboard</a></li>
              <li><a class="dropdown-item" routerLink="/inventory/add">Add New Item</a></li>
            </ul>
          </li>
        </ul>

        <div class="d-flex align-items-center text-white">
          <span>Welcome, {{ user.fullname }}</span>
          <div class="user-avatar ms-2" [title]="user.fullname">
            {{ user.fullname.charAt(0).toUpperCase() }}
          </div>
          <button (click)="logout()" class="btn btn-outline-light btn-sm ms-3">Logout</button>
        </div>
      </div>
      }
    </div>
  </nav>
</header>
