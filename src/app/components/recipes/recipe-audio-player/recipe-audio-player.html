<div class="audio-player-container mt-2">

  <button class="btn btn-secondary btn-sm"
          [disabled]="status === 'loading' || !instructions || instructions.length === 0"
          (click)="requestSpeech()">
    @if (status === 'loading') {
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span role="status" class="ms-1">Generating...</span>
    } @else {
      <i class="bi bi-soundwave me-1"></i> Read Instructions
    }
  </button>

  @if (status === 'error' && errorMessage) {
    <div class="alert alert-danger alert-sm mt-2 p-2 small">
        <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ errorMessage }}
    </div>
  }

  @if (status === 'ready' || status === 'playing' || status === 'paused') {
    <div class="audio-controls mt-2 d-flex align-items-center border rounded p-2 bg-light">
      @if (status !== 'playing') {
        <button class="btn btn-success btn-sm me-2" (click)="playAudio()" title="Play">
          <i class="bi bi-play-fill"></i>
        </button>
      } @else {
        <button class="btn btn-warning btn-sm me-2" (click)="pauseAudio()" title="Pause">
          <i class="bi bi-pause-fill"></i>
        </button>
      }
      <button class="btn btn-danger btn-sm me-3" (click)="stopAudio()" title="Stop">
        <i class="bi bi-stop-fill"></i>
      </button>

      <div class="d-flex align-items-center flex-grow-1">
            <i class="bi bi-volume-down-fill me-1"></i>
            <input type="range" class="form-range flex-grow-1" min="0" max="1" step="0.05"
                   [value]="currentVolume" (input)="setVolume($event)" title="Volume">
            <i class="bi bi-volume-up-fill ms-1"></i>
       </div>
    </div>
  }

</div>
